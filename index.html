<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="claude:viewport-fit-sides" content="cover">
<title>Unter fremder Flagge — 3D-U-Boot-Abenteuer</title>
<meta name="description" content="Unter fremder Flagge: ein 3D-U-Boot-Abenteuer mit offener Spielwelt, Kampagne, Karten, Missionen und Flottille. Spiele direkt im Browser.">
<meta name="theme-color" content="#0b1519">
<meta property="og:title" content="Unter fremder Flagge">
<meta property="og:description" content="Ein Browser-U-Boot-Abenteuer mit sechs Regionen, Kampagne und offener See.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head><body>
<style>
:root{
  --bg:#0b1519;--ink:#e9e4d4;--mut:#9aa7a6;--panel:rgba(10,18,22,.76);--line:rgba(233,228,212,.2);
  --acc:#e8552d;--ok:#4fe0c8;--warn:#ffd25a;--bad:#ff5a4a;
  --paper:#e7dcc0;--paper-ink:#1d2326;--paper-mut:#5d5a4c;--paper-line:rgba(29,35,38,.25);
  --d:'Big Shoulders Stencil Display',Impact,'Arial Narrow',sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;--s:'IBM Plex Sans',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left));--gr:max(16px,env(safe-area-inset-right));--gt:max(12px,env(safe-area-inset-top));--gb:max(12px,env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#172126;--paper-ink:#e7dcc0;--paper-mut:#9aa7a6;--paper-line:rgba(231,220,192,.22)}}
:root[data-theme="dark"]{--paper:#172126;--paper-ink:#e7dcc0;--paper-mut:#9aa7a6;--paper-line:rgba(231,220,192,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--s);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--m);font-size:12px}
#hud button{pointer-events:auto}
.pan{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);backdrop-filter:blur(3px)}
#top{position:absolute;left:var(--gl);top:var(--gt);display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:min(420px,calc(50vw - min(420px,34vw)/2 - 24px))}
#objective{padding:8px 12px;display:grid;gap:2px;min-width:0}
#objective small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#objective b{font-family:var(--s);font-weight:600;font-size:14px;line-height:1.25}
#stars{display:flex;gap:6px;padding:7px 12px;align-items:center}
#stars i{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--mut);opacity:.5}
#stars i.on{background:var(--bad);border-color:var(--bad);opacity:1}
#compass{position:absolute;left:50%;top:var(--gt);transform:translateX(-50%);width:min(420px,34vw);height:36px;background:var(--panel);border:1px solid var(--line)}
#compass canvas{width:100%;height:100%;display:block}
#radar{position:absolute;right:var(--gr);top:calc(var(--gt) + 40px);width:176px;height:176px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
#hudbtns{position:absolute;right:var(--gr);top:var(--gt);display:flex;gap:6px}
#hudbtns button{background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:30px}
#hudbtns button:hover{border-color:var(--ok)}
#gauges{position:fixed;left:var(--gl);bottom:var(--gb);width:252px;padding:10px 12px;display:grid;gap:7px}
.g{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px}
.g span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.g div{height:8px;background:rgba(255,255,255,.1);position:relative}
.g i{position:absolute;inset:0 auto 0 0;background:var(--ok);width:50%;transition:width .2s}
.g i.low{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}
.row b{color:var(--ink);font-weight:500}
#tubes{display:flex;gap:3px}
#tubes i{width:9px;height:14px;border:1px solid var(--mut);display:block}
#tubes i.rdy{background:var(--ok);border-color:var(--ok)}
#tubes i.ld{background:var(--warn);border-color:var(--warn);opacity:.6}
#depth{font-family:var(--d);font-size:16px;letter-spacing:.05em;color:var(--ink);white-space:nowrap}
#feed{position:absolute;left:var(--gl);top:calc(var(--gt) + 112px);display:grid;gap:4px;max-width:min(380px,60vw)}
#feed div{padding:5px 9px;background:var(--panel);border-left:3px solid var(--mut);font-family:var(--s);font-size:12px;animation:fin .25s ease-out;transition:opacity .6s}
#feed .good{border-color:var(--ok)}#feed .warn{border-color:var(--warn)}#feed .bad{border-color:var(--bad)}
#radio{position:absolute;left:50%;bottom:calc(var(--gb) + 50px);transform:translateX(-50%);width:min(560px,calc(100% - 2*var(--gl) - 24px));padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-bottom:2px solid var(--ok);font-family:var(--s);font-size:13px;line-height:1.35;animation:fin .3s ease-out}
#radio b{display:block;font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ok);margin-bottom:2px}
#prompt{position:absolute;left:50%;bottom:calc(var(--gb) + 6px);transform:translateX(-50%);padding:7px 16px;background:var(--acc);color:#fff;font-family:var(--m);font-size:13px;letter-spacing:.04em;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{background:rgba(0,0,0,.35);padding:1px 6px;margin-right:8px;font-family:var(--m)}
#salv{position:absolute;left:50%;bottom:calc(var(--gb) + 46px);transform:translateX(-50%);width:200px;height:8px;background:rgba(255,255,255,.15)}
#salv i{display:block;height:100%;background:var(--warn);width:0}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:1px solid rgba(255,255,255,.55);border-radius:50%;opacity:.7}
#cross::after{content:'';position:absolute;inset:7px;background:rgba(255,255,255,.7);border-radius:50%}
#lockbox{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid var(--bad);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#lockbox::before,#lockbox::after{content:'';position:absolute;background:var(--bad)}
#lockbox::before{left:50%;top:-8px;width:2px;height:6px}#lockbox::after{left:50%;bottom:-8px;width:2px;height:6px}
#lockinfo{position:absolute;transform:translate(-50%,28px);padding:3px 8px;background:var(--panel);border:1px solid var(--bad);font-size:11px;white-space:nowrap}
#lead{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--warn);transform:rotate(45deg)}
#scope{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 36%,#000 37%);}
#scope::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
#scope::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.6)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 160px rgba(120,0,0,0);transition:box-shadow .4s}
#vig.hit{box-shadow:inset 0 0 160px rgba(200,0,0,.7)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:11}
#touch .grp{position:absolute;display:grid;gap:8px;pointer-events:none}
#touch button{pointer-events:auto;width:54px;height:54px;background:var(--panel);border:1px solid var(--line);font-family:var(--m);font-size:11px;letter-spacing:.04em;touch-action:none;display:grid;place-items:center;padding:0}
#touch button:active,#touch button.on{background:var(--acc);border-color:var(--acc)}
#tl{left:var(--gl);bottom:calc(var(--gb) + 12px);grid-template-columns:none;gap:8px;justify-items:start}
#stick{pointer-events:auto;position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(10,18,22,.5) 0,rgba(10,18,22,.78) 100%);border:1px solid var(--line);touch-action:none;display:grid;place-items:center}
#stick::before,#stick::after{content:'';position:absolute;background:rgba(233,228,212,.18)}#stick::before{left:50%;top:10px;bottom:10px;width:1px}#stick::after{top:50%;left:10px;right:10px;height:1px}
#stick i{width:52px;height:52px;border-radius:50%;background:rgba(232,85,45,.78);border:2px solid rgba(255,255,255,.55);transition:transform .05s;z-index:1}
#stick.on i{background:var(--acc);transition:none}
#stick span{position:absolute;top:4px;font-family:var(--m);font-size:9px;letter-spacing:.14em;color:var(--mut)}
#tl .mini{display:flex;gap:6px;pointer-events:none}
#tl .mini button{width:auto;min-width:48px;height:34px;padding:0 8px;font-size:10px}
#tr{right:var(--gr);bottom:var(--gb);grid-template-columns:repeat(3,54px)}

/* ---------- Titel & Blätter ---------- */
#title{position:fixed;inset:0;z-index:20;display:grid;align-content:center;justify-items:start;padding:var(--gt) var(--gr) var(--gb) var(--gl);background:linear-gradient(90deg,rgba(6,12,15,.88) 0,rgba(6,12,15,.55) 46%,rgba(6,12,15,0) 80%)}
#title .kick{font-family:var(--m);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ok)}
#title h1{font-family:var(--d);font-weight:800;font-size:clamp(44px,9vw,120px);line-height:.88;letter-spacing:.02em;margin:10px 0 14px;text-transform:uppercase;max-width:10ch}
#title h1 em{font-style:normal;color:var(--acc)}
#title p{max-width:44ch;color:var(--mut);line-height:1.5;margin:0 0 22px;font-size:15px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--d);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;padding:10px 22px;min-height:46px;background:var(--acc);color:#fff;border:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:rgba(233,228,212,.12);color:var(--ink)}
.btn.sm{font-size:16px;padding:6px 14px;min-height:34px}
.btn[disabled]{opacity:.4;cursor:default}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,9,11,.66);padding:var(--gt) var(--gr) var(--gb) var(--gl);overflow:auto}
.sheet{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);padding:22px 24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);background-image:repeating-linear-gradient(0deg,transparent 0,transparent 31px,var(--paper-line) 32px);background-blend-mode:multiply;border-top:6px solid var(--acc);touch-action:pan-y}
.sheet.wide{width:min(860px,100%)}
.sheet .kick{font-family:var(--m);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper-mut)}
.sheet h2{font-family:var(--d);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:.95;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.02em}
.sheet .sub{font-family:var(--m);font-size:12px;letter-spacing:.06em;color:var(--paper-mut);margin-bottom:12px}
.sheet p{line-height:1.55;font-size:15px;margin:0 0 10px;max-width:60ch}
.sheet .btns{margin-top:14px}
.sheet .btn.ghost{background:transparent;color:var(--paper-ink);border:2px solid var(--paper-ink);clip-path:none}
.bar{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--paper-line);padding:8px 0;gap:12px;flex-wrap:wrap}
.bar b{font-family:var(--m);font-weight:600}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tab{font-family:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--paper-ink);background:transparent;color:var(--paper-ink)}
.tab.on{background:var(--paper-ink);color:var(--paper)}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--paper-line)}
.up b{font-family:var(--d);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.up span{color:var(--paper-mut);font-size:13px}
.up .pips{display:flex;gap:3px;margin-top:3px}
.up .pips i{width:14px;height:6px;border:1px solid var(--paper-ink);display:block}.up .pips i.on{background:var(--acc);border-color:var(--acc)}
.note{border:1px dashed var(--paper-ink);padding:8px 12px;margin:6px 0;background:rgba(0,0,0,.04)}
.note b{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.msg{min-height:20px;font-family:var(--m);font-size:12px;color:var(--acc);margin-top:8px}
#mapc{height:min(60dvh,calc(100vw - 80px));width:auto;max-width:100%;aspect-ratio:1;margin:0 auto;background:#0d2a35;display:block;border:2px solid var(--paper-ink);touch-action:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:6px 0}
.keys kbd{font-family:var(--m);background:var(--paper-ink);color:var(--paper);padding:0 6px;justify-self:start}
.toastnote{position:fixed;right:var(--gr);bottom:calc(var(--gb) + 70px);z-index:12;width:min(320px,calc(100% - 2*var(--gl)));background:var(--paper);color:var(--paper-ink);padding:10px 14px;border-left:4px solid var(--warn);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fin .3s ease-out;pointer-events:auto}
.toastnote b{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block}
.toastnote span{font-size:13px;line-height:1.4;display:block;margin-top:2px}

/* ---------- Welt: Anzeige, Banner, Karte, Logbuch ---------- */
#objective #tgt{font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--ok)}
#objective #tgt:empty{display:none}
.g.xp i{background:var(--warn)}
#banner{position:absolute;left:50%;top:19%;transform:translateX(-50%);text-align:center;max-width:calc(100% - 2*var(--gl) - 16px);pointer-events:none;animation:ban 3.6s ease-out forwards;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#banner small{display:block;font-family:var(--m);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--warn)}
#banner b{display:block;font-family:var(--d);font-weight:800;font-size:clamp(30px,6vw,60px);letter-spacing:.06em;text-transform:uppercase;line-height:1}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) scale(1.06)}12%{opacity:1;transform:translateX(-50%)}78%{opacity:1}100%{opacity:0}}
.mapbox{display:grid;gap:8px}
#mapc{cursor:crosshair}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mapbar select{flex:1 1 180px;min-width:0;font-family:var(--m);font-size:12px;padding:7px 8px;background:transparent;color:var(--paper-ink);border:1px solid var(--paper-ink);min-height:34px}
.mapinfo{font-family:var(--m);font-size:12px;min-height:34px;color:var(--paper-ink);border-left:3px solid var(--acc);padding:4px 8px;background:rgba(0,0,0,.05)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--m);font-size:10px;color:var(--paper-mut)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.meter{height:8px;background:var(--paper-line);position:relative;margin:4px 0 2px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.meter.ok i{background:#2f8f7a}
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--paper-line)}
.crow b{font-family:var(--d);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.crow span{font-size:13px;color:var(--paper-mut)}
.crow .rw{font-family:var(--m);font-size:11px;color:var(--paper-ink)}
.crow.off{opacity:.5}
.rankbox{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rankbox big{font-family:var(--d);font-weight:800;font-size:48px;line-height:1}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--paper-line)}
.stat b{font-family:var(--m);font-weight:600}
.medal{display:grid;grid-template-columns:22px 1fr;gap:0 8px;padding:6px 0;border-bottom:1px solid var(--paper-line)}
.medal i{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper-ink);margin-top:2px}
.medal.on i{background:var(--warn);border-color:var(--paper-ink)}
.medal.off{opacity:.45}
.medal b{font-family:var(--d);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.medal span{font-size:12px;color:var(--paper-mut);grid-column:2}
@media (max-width:720px){#hudbtns #bMute{display:none}.g.xp{grid-column:1/-1}#banner{top:30%}}

/* ---------- Einstellungen ---------- */
.set{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--paper-line)}
.set label{font-size:14px;display:grid;gap:2px}.set label small{font-size:11px;color:var(--paper-mut)}
.set .ctl{display:flex;align-items:center;gap:10px}.set .ctl b{font-family:var(--m);font-size:12px;min-width:44px;text-align:right}
.set input[type=range]{width:min(210px,40vw);accent-color:var(--acc)}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.set select{font-family:var(--m);font-size:13px;padding:6px 8px;background:transparent;color:var(--paper-ink);border:1px solid var(--paper-ink);min-height:34px}

/* ---------- Kommando ---------- */
.cmd{position:fixed;inset:0;z-index:40;background:#0a1316;touch-action:none}
.cmd-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cmd-hud{position:absolute;inset:0;pointer-events:none;font-family:var(--m);font-size:12px}
.cmd-top{position:absolute;left:var(--gl);right:var(--gr);top:var(--gt);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--panel);padding:8px 12px;border-left:3px solid var(--acc)}
.cmd-title{font-family:var(--d);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.cmd-obj{color:var(--mut)}
.cmd-bars{position:absolute;left:var(--gl);bottom:var(--gb);display:flex;gap:14px;background:var(--panel);padding:8px 12px}
.cmd-bar{position:relative;display:grid;gap:2px;min-width:96px;padding-bottom:8px;border-bottom:6px solid rgba(255,255,255,.12)}
.cmd-bar span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cmd-bar i{position:absolute;left:0;bottom:-6px;height:6px;width:0;background:var(--ok);transition:width .15s}
.cmd-bar i.cmd-alert{background:var(--bad)}
.cmd-bar b{font-weight:500;font-size:16px}
.cmd-msg{position:absolute;left:50%;top:calc(var(--gt) + 64px);transform:translateX(-50%);padding:6px 14px;background:var(--panel);border-bottom:2px solid var(--warn);max-width:calc(100% - 32px);text-align:center;font-family:var(--s);font-size:13px}
.cmd-msg:empty{display:none}
.cmd-help{position:absolute;right:var(--gr);bottom:var(--gb);max-width:min(460px,50vw);font-size:10px;line-height:1.5;color:var(--mut);background:var(--panel);padding:6px 10px}
.cmd-touch{display:none}
@media (pointer:coarse),(max-width:720px){
  .cmd-help{display:none}
  .cmd-touch{display:block;position:absolute;inset:0}
  .cmd-stick{pointer-events:auto;position:absolute;left:var(--gl);bottom:calc(var(--gb) + 56px);width:110px;height:110px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;touch-action:none}
  .cmd-stick i{width:44px;height:44px;border-radius:50%;background:var(--ok);opacity:.7}
  .cmd-touch button{pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-family:var(--m);font-size:11px;touch-action:none}
  .cmd-touch button[data-a=act]{right:var(--gr);bottom:calc(var(--gb) + 56px);background:var(--acc)}
  .cmd-touch button[data-a=shoot]{right:calc(var(--gr) + 72px);bottom:calc(var(--gb) + 56px)}
  .cmd-touch button[data-a=hit]{right:var(--gr);bottom:calc(var(--gb) + 126px)}
  .cmd-touch button[data-a=throw]{right:calc(var(--gr) + 72px);bottom:calc(var(--gb) + 126px)}
}

@media (min-width:721px){#radio{left:calc(var(--gl) + 268px);transform:none;width:min(560px,calc(100% - var(--gl) - var(--gr) - 268px))}}

@media (max-width:720px){
  #compass{display:none}
  #top{max-width:calc(100% - 150px)}

  #radar{width:104px;height:104px;top:calc(var(--gt) + 38px)}

  .g{grid-template-columns:44px 1fr}

  #feed{top:calc(var(--gt) + 250px);max-width:calc(100% - 140px)}
  #radio{bottom:calc(var(--gb) + 218px);font-size:12px}
  #prompt{bottom:calc(var(--gb) + 174px)}
  #salv{bottom:calc(var(--gb) + 212px)}

  #tr{bottom:var(--gb);grid-template-columns:repeat(3,48px)}

}

  <div style="max-width:460px"><div style="font-size:11px;letter-spacing:.3em;color:#4fe0c8">U-BOOT · OFFENE SEE</div><h1 style="font-size:clamp(32px,7vw,64px);line-height:.95;letter-spacing:.04em;text-transform:uppercase">Unter fremder Flagge</h1><p id="loadState">3D-Grafik wird geladen …</p><p style="font-size:12px;opacity:.65">Zum Spielen ist ein Browser mit WebGL erforderlich. Der erste Start benötigt eine Internetverbindung.</p></div>
</div>
<script>
(function () {
  const status = document.getElementById('loadState');
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  let index = 0;
  function fail(message) { status.textContent = message; status.style.color = '#ffd25a'; }
  function startGame() {
    const script = document.createElement('script');
    script.src = './game.js';
    script.onerror = () => fail('Die Spieldatei „game.js“ konnte nicht geladen werden. Dateien gemeinsam auf einem Webserver bereitstellen.');
    document.body.appendChild(script);
  }
  function tryThree() {
    if (window.THREE) return startGame();
    if (index === urls.length) return fail('Die 3D-Bibliothek ist nicht erreichbar. Bitte Internetverbindung prüfen und die Seite neu laden.');
    status.textContent = 'Lade Grafikmodul (' + (index + 1) + '/' + urls.length + ') …';
    const el = document.createElement('script');
    el.src = urls[index++]; el.referrerPolicy = 'no-referrer';
    el.onload = () => window.THREE ? startGame() : tryThree();
    el.onerror = tryThree;
    document.head.appendChild(el);
  }
  tryThree();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready)
      .then((r) => { if (r.active) r.active.postMessage({ type: 'PREFETCH_THREE' }); }).catch(() => {}));
  }
})();
</script>
